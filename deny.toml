# cargo deny check (CI: .github/workflows/ci.yml). Licenses: our own crates
# are AGPL-3.0-only (allowed only for them, below); every third-party crate
# must be under one of the permissive licenses listed here. Advisories come
# from RustSec; sources must be crates.io or the one pinned git dependency.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
exceptions = [
  # This workspace (license in the root Cargo.toml and LICENSE). Not in
  # `allow`, so no dependency may bring in AGPL code unnoticed.
  { allow = ["AGPL-3.0-only"], crate = "railwatch-server" },
  { allow = ["AGPL-3.0-only"], crate = "railwatch-load" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/cole-robertson/inertia-omega"]
