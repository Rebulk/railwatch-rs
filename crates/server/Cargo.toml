[package]
name = "railwatch-server"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "railwatch_server"
path = "src/lib.rs"

[[bin]]
name = "railwatch"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "ws", "original-uri"] }
http-body-util = "0.1"
# serve.rs: axum::serve's loop with header/body/idle timeouts and a connection cap.
http-body = "1"
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
# bundled SQLite is compiled with SQLITE_ENABLE_FTS5 (logs_fts needs it).
rusqlite = { version = "0.40", features = ["bundled", "backup", "trace"] }
# preserve_order: Ruby hashes keep insertion order. arbitrary_precision: keep the
# literal so 1 (Integer) and 1.0 (Float) stay distinct, and bignums survive.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
indexmap = "2"
# The C zlib backend, so inflate errors carry zlib's own messages, as Ruby's Zlib does.
flate2 = { version = "1", default-features = false, features = ["zlib"] }
libz-sys = { version = "1", default-features = false, features = ["static", "libc"] }
sha2 = "0.10"
# import-rails: Rails Active Record encryption (PBKDF2 + AES-256-GCM), already in the tree via rustls.
ring = "0.17"
md-5 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "v7"] }
getrandom = "0.3"
mimalloc = { version = "0.1", default-features = false }
tracing = "0.1"
# Alerts (Phase 2): signed webhooks, Slack, optional SMTP, title_pattern regexes.
hmac = "0.12"
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
# Solid Queue schedules (fugit's cron and "every ..." forms) for CheckScheduledTasksJob.
croner = "3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
# Phase 3: the web app (control DB, auth, Inertia shell, assets, cable).
omega.workspace = true
bcrypt = "0.17"
subtle = "2"
chacha20poly1305 = "0.10"
include_dir = "0.7"
toml = "0.9"
rpassword = "7"
libc = "0.2"
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# Backups (storage::backup): zstd-compressed snapshots to S3-compatible storage.
zstd = { version = "0.13", features = ["zstdmt"] }
# Built-in HTTPS (tls.rs): Let's Encrypt via TLS-ALPN-01, certificate cached in the data dir.
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tls12", "webpki-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
x509-parser = "0.18"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "tokio1-rustls-tls", "rustls", "ring", "webpki-roots", "builder", "pool"] }
# Google sign-in (web::google): ID-token claims; RS256 is verified with ring (no aws-lc, no `rsa` crate).
jsonwebtoken = { version = "11", default-features = false }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
# `railwatch upgrade` verifies the release's Sigstore bundle in-process
# (release_signature.rs) against the embedded public-good trust root.
# Without aws-lc-rs: signatures are checked with ring (already here) through
# sigstore-crypto's CryptoProvider, prehashed ECDSA with p256/p384.
sigstore-verify = { version = "0.15", default-features = false }
sigstore-trust-root = { version = "0.15", default-features = false }
sigstore-crypto = { version = "0.15", default-features = false }
sigstore-types = "0.15"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }

[[bin]]
name = "props-dump"
path = "src/bin/props_dump.rs"

[[bin]]
name = "rw-detectors"
path = "src/bin/rw_detectors.rs"

[[bin]]
name = "mcp-dump"
path = "src/bin/mcp_dump.rs"

[[bin]]
name = "page-replay"
path = "src/bin/page_replay.rs"

[[bin]]
name = "api-dump"
path = "src/bin/api_dump.rs"

[[bin]]
name = "page-hammer"
path = "src/bin/page_hammer.rs"
