# cargo-about (bin/third-party-licenses): the licenses of every crate linked
# into the released binary (both release targets; no dev or build-only
# crates). Our own crates are publish = false, so `private` skips them.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
