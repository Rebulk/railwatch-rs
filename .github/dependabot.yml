# Dependabot version and security updates. Grouped weekly so a week of
# bumps is one PR per ecosystem; security updates still open on their own.
# Majors get their own group: one breaking upgrade (a RustCrypto 0.x bump, a
# TypeScript major) used to hold every patch in its group back until someone
# did the migration.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
      cargo-major:
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        patterns: ["*"]
        update-types: [major]
    # Each needs its own migration, not a bump: Inertia 3 changes the
    # protocol the server's inertia.rs speaks, and plugin-react 6 drops the
    # `babel` option the React compiler is configured through.
    ignore:
      - dependency-name: "@inertiajs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
