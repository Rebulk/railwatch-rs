# CI for pull requests and main: tests, rustfmt, clippy (warnings are errors),
# cargo audit (RustSec advisories) and cargo deny (licenses, bans, sources,
# advisories; deny.toml). Read-only token, no credentials kept, every
# action pinned to a full commit SHA (the comment is its release).
#
# The server embeds the built frontend (include_dir!), which bin/build makes
# from frontend/, as in release.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned, so a new stable's new lints never fail a PR that did not
      # touch the code they flag; bump it deliberately (and fix what it finds).
      - name: toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt && rustup default 1.99.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
      - name: brotli (bin/build precompresses assets)
        run: command -v brotli || (sudo apt-get update -qq && sudo apt-get install -y -qq brotli)
      - name: frontend (include_dir! embeds frontend/dist)
        run: SKIP_CARGO=1 bin/build
      - name: frontend tests
        run: cd frontend && pnpm check && pnpm test
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit
        run: cargo audit --deny warnings
      - name: cargo deny
        run: cargo deny --locked check
